<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>勤務管理</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

<main class="container">

    <h1>勤務管理</h1>

    <section class="card">

        <h2>勤務を記録</h2>

       <label for="workDate">勤務日</label>

<div class="date-picker-wrap">

    <div
        class="date-picker-display"
        id="workDateDisplay"
    >
        <span id="workDateText">
            日付を選択
        </span>

        <span class="date-picker-icon">
            📅
        </span>
    </div>

    <input
        type="date"
        id="workDate"
        class="date-picker-native"
    >

</div>


        <div class="input-type">

            <span class="input-type-title">
                入力方法
            </span>

            <label class="radio-label">
                <input
                    type="radio"
                    name="inputType"
                    value="direct"
                    checked
                >
                拘束時間を直接入力
            </label>

            <label class="radio-label">
                <input
                    type="radio"
                    name="inputType"
                    value="time"
                >
                出庫・帰庫から計算
            </label>

        </div>


        <!-- 直接入力 -->
        <div id="directInput">

            <label>拘束時間</label>

            <div class="duration-input">

                <input
                    type="number"
                    id="directHours"
                    min="0"
                    max="30"
                    inputmode="numeric"
                    placeholder="17"
                >

                <span>時間</span>

                <input
                    type="number"
                    id="directMinutes"
                    min="0"
                    max="59"
                    inputmode="numeric"
                    placeholder="40"
                >

                <span>分</span>

            </div>

        </div>


        <!-- 出庫帰庫入力 -->
        <div
            id="timeInput"
            class="hidden"
        >

            <label for="startTime">
                出庫時刻
            </label>

            <input
                type="time"
                id="startTime"
            >


            <label for="endTime">
                帰庫時刻
            </label>

            <input
                type="time"
                id="endTime"
            >


            <div class="calculated-result">

                <span>今回の拘束時間</span>

                <strong id="calculatedHours">
                    --
                </strong>

            </div>

        </div>


        <button id="saveButton">
            この勤務を保存
        </button>

    </section>


    <div class="menu-buttons">

        <button
            class="secondary-button"
            id="statusButton"
        >
            今月の状況を見る
        </button>

        <button
            class="secondary-button"
            id="historyButton"
        >
            勤務履歴を見る
        </button>

    </div>

</main>


<!-- ==========================
     今月状況モーダル
     ========================== -->

<div
    class="modal hidden"
    id="statusModal"
>

    <div class="modal-panel">

        <button
            class="close-button"
            data-close="statusModal"
        >
            ×
        </button>


        <h2>今月の状況</h2>

        <div
            class="period-label"
            id="currentPeriod"
        >
            --
        </div>


        <div class="summary-row">

            <span>勤務回数</span>

            <strong id="workCount">
                0 / 13
            </strong>

        </div>


        <div class="summary-row">

            <span>累計拘束時間</span>

            <strong id="totalHours">
                0時間00分
            </strong>

        </div>


        <div class="summary-row">

            <span>262時間まで残り</span>

            <strong id="remainingHours">
                262時間00分
            </strong>

        </div>


        <hr>


        <h3>13勤務目の予測</h3>

        <div class="shift-selector">

            <span class="selector-title">
                13勤務目の基本出庫
            </span>

            <div class="shift-buttons">

                <label class="shift-option">
                    <input
                        type="radio"
                        name="finalShiftType"
                        value="15"
                        checked
                    >
                    <span>15:00</span>
                </label>

                <label class="shift-option">
                    <input
                        type="radio"
                        name="finalShiftType"
                        value="16"
                    >
                    <span>16:00</span>
                </label>

            </div>

        </div>


        <div id="forecast">
            まだ勤務記録がありません。
        </div>


        <button
            class="secondary-button modal-action"
            id="previousStatusButton"
        >
            前月の状況を見る
        </button>

    </div>

</div>


<!-- ==========================
     前月状況
     ========================== -->

<div
    class="modal hidden"
    id="previousStatusModal"
>

    <div class="modal-panel">

        <button
            class="close-button"
            data-close="previousStatusModal"
        >
            ×
        </button>


        <h2>前月の状況</h2>

        <div
            class="period-label"
            id="previousPeriod"
        >
            --
        </div>


        <div class="summary-row">

            <span>勤務回数</span>

            <strong id="previousWorkCount">
                0 / 13
            </strong>

        </div>


        <div class="summary-row">

            <span>累計拘束時間</span>

            <strong id="previousTotalHours">
                0時間00分
            </strong>

        </div>

    </div>

</div>


<!-- ==========================
     今月履歴
     ========================== -->

<div
    class="modal hidden"
    id="historyModal"
>

    <div class="modal-panel">

        <button
            class="close-button"
            data-close="historyModal"
        >
            ×
        </button>


        <h2>今月の勤務履歴</h2>

        <div
            class="period-label"
            id="historyPeriod"
        >
            --
        </div>


        <div id="workHistory">
            勤務記録はありません。
        </div>


        <button
            class="secondary-button modal-action"
            id="previousHistoryButton"
        >
            前月の履歴を見る
        </button>

    </div>

</div>


<!-- ==========================
     前月履歴
     ========================== -->

<div
    class="modal hidden"
    id="previousHistoryModal"
>

    <div class="modal-panel">

        <button
            class="close-button"
            data-close="previousHistoryModal"
        >
            ×
        </button>


        <h2>前月の勤務履歴</h2>

        <div
            class="period-label"
            id="previousHistoryPeriod"
        >
            --
        </div>


        <div id="previousWorkHistory">
            勤務記録はありません。
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
