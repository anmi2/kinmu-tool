<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="NextGuessの開発状況と、これから実装する機能をわかりやすく公開しています。"><title>NextGuess開発サイト</title><style>
:root{--green:#16845e;--ink:#273b31;--muted:#728178;--line:#e6eee8;--soft:#f4faf6}
*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.75}main{max-width:760px;margin:auto;padding:35px 22px 70px}
h1{font-size:clamp(26px,5vw,34px);letter-spacing:-.04em;margin:0;color:#184c35}header{padding-bottom:23px;border-bottom:2px solid #d3e9dc}header p{color:var(--muted);font-size:14px;margin:8px 0 0}.date{margin-top:14px;color:var(--muted);font-size:12px}
section{margin-top:38px}h2{font-size:21px;letter-spacing:-.02em;margin:0 0 16px;display:flex;gap:10px;align-items:center}h2:before{content:"";width:5px;height:23px;border-radius:6px;background:var(--green)}.sub{font-size:13px;color:var(--muted);margin:-7px 0 15px}
.item{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:17px 3px}.item:first-child{border-top:1px solid var(--line)}.symbol{width:20px;height:20px;border:2px solid #b7c9be;border-radius:6px;flex:0 0 20px;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:white}.item.active .symbol{border-color:var(--green);background:var(--green)}.item.done .symbol{border-color:#80b69a;background:#80b69a}.item.done .symbol:after{content:"✓"}.item.active .symbol:after{content:"•"}.item.planned .symbol{border-radius:50%;border-color:#b6d3c1;background:var(--soft)}.content{flex:1;min-width:0}.headline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-size:16px;font-weight:680}.status{font-size:11px;color:var(--green);background:var(--soft);border-radius:4px;padding:1px 8px}.item p{font-size:13px;color:var(--muted);margin:5px 0 0}.item.done .name{text-decoration:line-through;color:#899a8f}.item.done p{color:#9aa79d}.item.done .status{background:#f0f3f1;color:#899a8f}
footer{font-size:12px;color:#91a097;border-top:1px solid var(--line);margin-top:40px;padding-top:18px}
</style></head><body><main><header><h1>NextGuess開発サイト</h1><p>いま進めていることと、これから作る機能をまとめています。</p><div class="date" id="date"></div></header>
<section><h2>進行中のタスクリスト</h2><p class="sub">終わった作業には横線を引いて残していきます。</p><div id="current">読み込み中…</div></section>
<section><h2>実装予定機能</h2><p class="sub">今後、順番に取り組んでいきたい機能です。</p><div id="planned">読み込み中…</div></section>
<footer>NextGuess ｜ 開発状況は随時更新します。</footer></main><script>
const escapeHtml=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(x,planned){const s=planned?"planned":x.status;return '<article class="item '+escapeHtml(s)+'"><div class="symbol" aria-hidden="true"></div><div class="content"><div class="headline"><span class="name">'+escapeHtml(x.title)+'</span>'+(s==="done"?'<span class="status">完了</span>':s==="active"?'<span class="status">進行中</span>':"")+'</div><p>'+escapeHtml(x.note)+'</p></div></article>'}
fetch("data/public-roadmap.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("load");return r.json()}).then(d=>{document.getElementById("date").textContent="最終更新："+d.updated_at.replaceAll("-","/");document.getElementById("current").innerHTML=d.current.map(x=>card(x,false)).join("");document.getElementById("planned").innerHTML=d.planned.map(x=>card(x,true)).join("")}).catch(()=>{document.getElementById("current").textContent="表示できませんでした。再読み込みしてください。";document.getElementById("planned").textContent="表示できませんでした。"});
</script></body></html>
