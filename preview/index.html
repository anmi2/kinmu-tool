<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NextGuessの開発中タスクと実装予定機能を公開しています。">
<meta name="theme-color" content="#ffffff"><title>NextGuess開発サイト</title>
<style>
:root{--green:#16805b;--light:#eef7f1;--line:#e3e9e5;--ink:#192820;--muted:#65746a}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{width:min(820px,calc(100% - 36px));margin:0 auto;padding:42px 0 70px}
header{border-bottom:1px solid var(--line);padding-bottom:25px}h1{font-size:clamp(27px,5vw,38px);letter-spacing:-.045em;margin:0 0 6px}header p{font-size:14px;color:var(--muted);margin:0}.date{font-size:12px;color:var(--muted);margin-top:12px}
h2{font-size:21px;margin:0 0 18px;padding-left:12px;border-left:4px solid var(--green);line-height:1.3}
section{margin-top:45px}.intro{background:var(--light);border-radius:8px;padding:17px 20px;font-size:14px;margin-top:24px}.intro strong{display:block;color:var(--green);margin-bottom:4px}.intro p{margin:0}
.group{margin:22px 0}.group h3{font-size:14px;color:#476359;margin:0 0 9px}.task{padding:16px 0;border-bottom:1px solid var(--line)}.task:first-child{border-top:1px solid var(--line)}.taskhead{display:flex;gap:10px;justify-content:space-between;align-items:start}.taskname{font-size:15px;font-weight:700}.status{font-size:11px;color:var(--green);background:var(--light);padding:3px 9px;border-radius:4px;white-space:nowrap}.task p{font-size:13px;color:var(--muted);margin:6px 0 0}.future .taskname{font-weight:650}
.note{font-size:12px;color:var(--muted);margin-top:32px}footer{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media(max-width:500px){main{padding-top:27px}.taskhead{align-items:flex-start}.taskname{max-width:72%}}
</style>
</head><body><main>
<header><h1>NextGuess開発サイト</h1><p>開発中の作業と、これから実装する機能を公開しています。</p><div class="date" id="date"></div></header>
<div class="intro"><strong>現在の優先作業</strong><p id="priority">読み込み中…</p></div>
<section id="ongoing"><h2>進行中のタスクリスト</h2><div id="tasks">読み込み中…</div></section>
<section class="future" id="upcoming"><h2>実装予定機能</h2><div id="features">読み込み中…</div></section>
<p class="note">開発状況と優先順位は変更されることがあります。確認できていない作業は「確認待ち」と表示しています。</p>
<footer>NextGuess</footer>
</main>
<script>
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={doing:"優先作業",investigating:"調査中",verifying:"確認待ち",paused:"中断中",todo:"未着手",planned:"計画中"};
function task(i){return '<article class="task"><div class="taskhead"><span class="taskname">'+safe(i[1])+'</span><span class="status">'+safe(labels[i[2]]||i[2])+'</span></div><p>'+safe(i[3])+'</p></article>'}
fetch('data/roadmap.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load');return r.json()}).then(d=>{
 document.getElementById('date').textContent='最終更新：'+d.updated_at.replaceAll('-','/');
 document.getElementById('priority').textContent=d.headline;
 const a=d.sections;
 const current=a.filter(s=>s.id==='now'||s.id==='collection');
 const future=a.filter(s=>s.id==='app'||s.id==='business');
 document.getElementById('tasks').innerHTML=current.map(s=>'<div class="group"><h3>'+safe(s.name)+'</h3>'+s.items.map(task).join('')+'</div>').join('');
 document.getElementById('features').innerHTML=future.map(s=>'<div class="group"><h3>'+safe(s.name)+'</h3>'+s.items.map(task).join('')+'</div>').join('');
}).catch(()=>{document.getElementById('tasks').textContent='データを読み込めませんでした。';document.getElementById('features').textContent='再読み込みしてください。'});
</script></body></html>
